name: Flight Software Auto-Tagging Lifecycle

on:
  push:
    branches:
      - dev     # long-standing integration branch for testing
      - stable  # certified production branch

concurrency:
  group: manifest-tags-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # allows evaluation of merge history across branches

      - name: Read Base Version
        id: base_version
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')
          echo "BASE_VERSION=$BASE" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # TRACK 1: THE LONG-STANDING DEV BRANCH (Sequential -rc.X)
      - name: Handle Dev Branch Tagging
        if: github.ref == 'refs/heads/dev'
        id: dev_tag
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="${{ steps.base_version.outputs.BASE_VERSION }}"
          git fetch --force --tags origin

          rc=1
          while true; do
            candidate="v${BASE_VERSION}-rc.${rc}"

            if git rev-parse --verify --quiet "refs/tags/${candidate}" >/dev/null; then
              existing_sha="$(git rev-parse "${candidate}^{commit}")"

              if [[ "$existing_sha" == "$GITHUB_SHA" ]]; then
                echo "FINAL_TAG=${candidate}" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              rc=$((rc + 1))
              continue
            fi

            echo "FINAL_TAG=${candidate}" >> "$GITHUB_OUTPUT"
            exit 0
          done

      # TRACK 2: THE MAIN PRODUCTION BRANCH (Stable Release)
      - name: Handle Main Branch Tagging
        if: github.ref == 'refs/heads/stable'
        id: main_tag
        run: |
          STABLE_TAG="v${{ steps.base_version.outputs.BASE_VERSION }}"

          if git rev-parse "$STABLE_TAG" >/dev/null 2>&1; then
            echo "::error:: Tag $STABLE_TAG already exists on remote! The team forgot to bump the VERSION file."
            exit 1
          fi
          echo "FINAL_TAG=$STABLE_TAG" >> $GITHUB_OUTPUT

      # MINT AND PUBLISH ARTIFACT
      - name: Create Git Tag
        id: create_tag
        shell: bash
        run: |
          set -euo pipefail

          TAG_TO_MINT="${{ steps.dev_tag.outputs.FINAL_TAG || steps.main_tag.outputs.FINAL_TAG }}"

          if [[ -z "$TAG_TO_MINT" ]]; then
            echo "::error::No tag was calculated."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"

          # Check if the SPECIFIC tag we want to mint exists,
          # instead of general SHA matching that can conflict during Fast-Forwards
          if git rev-parse --verify --quiet "refs/tags/${TAG_TO_MINT}" >/dev/null; then
            echo "Tag ${TAG_TO_MINT} already exists; skipping minting."
          else
            git tag -a "$TAG_TO_MINT" "$GITHUB_SHA" -m "Release $TAG_TO_MINT"
            git push origin "refs/tags/${TAG_TO_MINT}"
          fi

          echo "MINTED_TAG=${TAG_TO_MINT}" >> "$GITHUB_OUTPUT"

      - name: Generate Manifest JSON
        run: |
          cat <<EOF > fprime-manifest.json
          {
            "manifest_format_version": "1.0.0",
            "flight_software_version": "${{ steps.create_tag.outputs.MINTED_TAG }}",
            "commit_sha": "${{ github.sha }}",
            "short_sha": "${{ steps.base_version.outputs.SHORT_SHA }}",
            "build_timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "branch": "${{ github.ref_name }}"
          }
          EOF

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ github.ref_name }}
          path: fprime-manifest.json
